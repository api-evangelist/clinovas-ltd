name: Clinovas LTD
description: 'Clinovas LTD (Clinova, clinova.ai) is an AI-powered patient recruitment platform for
  clinical trials. Per the company''s own site, it matches eligible patients to trials in minutes
  rather than months using AI-powered patient matching against hospital electronic health records
  (EHR). The solution is hospital-based and HIPAA-compliant, targeting clinical research organizations
  and trial sponsors operating in emerging markets including Eastern Europe and the CIS region. Backed
  by 500 Global. Added to the API Evangelist network as a company profile; no public developer API,
  OpenAPI, or developer portal was found at the time of enrichment.'
